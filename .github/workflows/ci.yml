name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base a proposito: con `branches: [main]` los PRs
  # apilados (los que apuntan a la rama padre en vez de a main) no
  # disparaban CI y quedaban sin validar hasta que el padre mergeaba.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres real (REQ-TEST-2, sdd/production-readiness): la suite ya no
    # corre sobre SQLite en memoria, sino contra un servicio Postgres 16
    # equivalente al `db-test` de docker-compose.yml (mismo contrato de un
    # solo env var, `TEST_DATABASE_URL` — ver decisión de diseño 1.1). Esto
    # ejercita migraciones Alembic reales, FKs, y tipos nativos de Postgres
    # en cada PR, no solo en el job separado `migraciones-desde-cero`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cataclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d cataclub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        # Pineada al SHA del commit en vez del tag movil: un tag puede
        # reapuntarse a otro codigo sin que el workflow cambie.
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        # --no-build: instala solo wheels, sin ejecutar setup scripts de
        # sdists. Verificado que los 72 paquetes del lock resuelven a wheels.
        run: uv sync --frozen --no-build

      - name: Run tests
        env:
          AMBIENTE: test
          # Ponemos una clave larga simulada para que el validador de Pydantic pase sin problemas
          JWT_SECRET_KEY: "clave_super_secreta_y_segura_de_mas_de_32_caracteres_para_los_tests"
          TEST_DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/cataclub_test
        run: uv run --frozen --no-build pytest tests/ -v --cov=app --cov-report=term-missing

  # Job temporario (decisión de diseño 1.5, sdd/production-readiness): corre
  # SOLO los archivos listados en `tests/_pendientes_postgres.py` sobre
  # SQLite, para que sus aserciones no dejen de ejecutarse mientras se
  # reparan uno por uno (PR-06a..06e). Se elimina en el commit de sunset
  # (PR-06f) junto con el allow-list y la rama SQLite de `conftest.py`.
  backend-pendientes-postgres:
    name: Backend — archivos pendientes de Postgres (SQLite temporal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run pending-postgres files on SQLite
        env:
          AMBIENTE: test
          JWT_SECRET_KEY: "clave_super_secreta_y_segura_de_mas_de_32_caracteres_para_los_tests"
        run: |
          ARCHIVOS=$(uv run --frozen --no-build python -c "from tests._pendientes_postgres import ARCHIVOS_PENDIENTES; print(' '.join(f'tests/{a}' for a in sorted(ARCHIVOS_PENDIENTES)))")
          echo "Archivos pendientes: $ARCHIVOS"
          uv run --frozen --no-build pytest $ARCHIVOS -v

  migraciones-desde-cero:
    name: Migraciones desde DB vacia (empty -> head)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Job dedicado con un servicio Postgres real: `tests/conftest.py` es
    # SQLite-backed (in-memory), así que el job `backend` NUNCA ejecuta
    # migraciones Alembic contra Postgres. Esto ya dejó pasar un bug real:
    # `c4d5e6f7a8b9` referenciaba una constraint con el nombre viejo que no
    # existe contra una DB creada desde cero (ver el comentario en ese
    # archivo de migración). Este job es la única prueba de que las 16
    # migraciones aplican en orden, de punta a punta, sobre Postgres real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cataclub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d cataclub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        # Pineada al SHA del commit en vez del tag movil: un tag puede
        # reapuntarse a otro codigo sin que el workflow cambie.
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        # --no-build: instala solo wheels, sin ejecutar setup scripts de
        # sdists. Verificado que los 72 paquetes del lock resuelven a wheels.
        run: uv sync --frozen --no-build

      - name: Run alembic upgrade head against an empty database
        env:
          AMBIENTE: test
          DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/cataclub_ci
          JWT_SECRET_KEY: "clave_super_secreta_y_segura_de_mas_de_32_caracteres_para_los_tests"
        run: uv run --frozen --no-build alembic upgrade head

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Coverage report
        continue-on-error: true
        run: pnpm run test:coverage

      - name: Build
        run: pnpm build

      - name: Prepare standalone
        run: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test

      - name: Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
